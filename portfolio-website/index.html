  <!-- ── Libraries (synchronous, before body) ───────────── -->

    {
      "imports": {

        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }

  <!-- Performance & capability detection (synchronous — sets globals before any slide script runs) -->
  <script src="scripts/performance.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
  <!-- Three.js r160 (Global fallback, though modules are preferred now) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js" defer></script>
  <!-- D3 v7 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" defer></script>
  <!-- KaTeX -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
  <!-- Lenis smooth scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
  <!-- Pyodide (loaded asynchronously — heavy WASM, only needed on-demand) -->
  <script>window.PYODIDE_CDN = 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/';</script>
</head>

<body>

  <!-- ── Progress indicator (global, slide count) ─────── -->
  <div id="global-progress" aria-hidden="true">
    <span class="gp-dot gp-dot-active" data-slide="1"></span>
    <span class="gp-dot" data-slide="2"></span>
    <span class="gp-dot" data-slide="3"></span>
    <span class="gp-dot" data-slide="4"></span>
    <span class="gp-dot" data-slide="5"></span>
    <span class="gp-dot" data-slide="6"></span>
  </div>

  <!-- ── Slide mount points ────────────────────────────── -->
  <main id="app" role="main">
    <div id="slide-01-container"></div>
    <div id="slide-02-container"></div>
    <div id="slide-03-container"></div>
    <div id="slide-04-container"></div>
    <div id="slide-05-container"></div>
    <div id="slide-06-container"></div>
  </main>

  <!-- ── Global AI Query Widget ──────────────────────── -->
  <div id="ai-widget-container">
    <button id="ai-orb-btn" class="ai-orb-btn" aria-label="Ask APU-X">✨</button>
    
    <div id="ai-modal" class="ai-modal">
      <div class="ai-modal-header">
        <div class="ai-modal-title">APU-X <span>Query Substrate</span></div>
        <button id="ai-modal-close" class="ai-modal-close">&times;</button>
      </div>
      <div id="ai-chat-area" class="ai-chat-area">
        <div class="ai-msg ai-msg-system">
          <p>The APU-X substrate is online.</p>
          <p>Ask a question about the Post-Mitigated Abraxas Model.</p>
        </div>
      </div>
      <div class="ai-input-area">
        <input type="text" id="ai-input" class="ai-input" placeholder="Query thesis vector space..." autocomplete="off">
        <button id="ai-submit" class="ai-submit">SEND</button>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════
       BOOTSTRAP SCRIPT
       Loads all slides, wires transitions, starts Lenis.
  ════════════════════════════════════════════════════ -->
  <script type="module">
    /* ── Helpers ──────────────────────────────────────── */
    async function loadHTML(containerId, htmlPath) {
      const res = await fetch(htmlPath);
      if (!res.ok) throw new Error(`Failed to load ${htmlPath}: ${res.status}`);
      document.getElementById(containerId).innerHTML = await res.text();
    }

    function loadScript(src, type="text/javascript") {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.type = type;
        let timeout = setTimeout(() => {
          console.warn(`Timeout loading ${src}`);
          resolve(); // Resolve anyway so we don't break the whole site
        }, 5000);
        
        s.onload = () => { clearTimeout(timeout); resolve(); };
        s.onerror = (e) => { clearTimeout(timeout); reject(e); };
        document.body.appendChild(s);
      });
    }

    /* ── Global progress dots ─────────────────────────── */
    function initProgressDots() {
      const dots = document.querySelectorAll(".gp-dot");
      // After slide swap: APU-X (id=slide-04) is DOM pos 3; PMM (id=slide-03) is DOM pos 4
      const slides = ["#slide-01", "#slide-02", "#slide-04", "#slide-03", "#slide-05", "#slide-06"];

      slides.forEach((sel, i) => {
        const el = document.querySelector(sel);
        if (!el) return;
        ScrollTrigger.create({
          trigger: el,
          start: "top 60%",
          end: "bottom 40%",
          onToggle(self) {
            dots.forEach((d, j) => d.classList.toggle("gp-dot-active", j === i && self.isActive));
          },
        });
      });
    }

    /* ── Transition: slide clips up as next enters ────── */
    function wireSlideTransition(outgoingId, incomingId) {
      const outgoing = document.querySelector(outgoingId);
      if (!outgoing) return;

      gsap.registerPlugin(ScrollTrigger);

      // Outgoing clips upward
      ScrollTrigger.create({
        trigger: outgoing,
        start: "top top",
        end: "+=80%",
        pin: false,
        onUpdate(self) {
          const p = self.progress;
          const scale = 1 - (p * 0.15);
          const opacity = 1 - p;
          
          outgoing.style.transformOrigin = "top center";
          outgoing.style.transform = `scale(${scale}) translateY(${p * 50}px)`;
          outgoing.style.opacity = opacity;
        },
      });
    }

    /* ── Transition: APU-X zooms INTO the 3D model on exit ── */
    function wireZoomOutTransition(outgoingId) {
      const outgoing = document.querySelector(outgoingId);
      if (!outgoing) return;

      gsap.registerPlugin(ScrollTrigger);

      ScrollTrigger.create({
        trigger: outgoing,
        start: "top top",
        end: "+=80%",
        pin: false,
        onUpdate(self) {
          const p = self.progress;
          const scale   = 1 + (p * 1.5); // 1 → 2.5
          const opacity = 1 - p;
          outgoing.style.transformOrigin = "center center";
          outgoing.style.transform = `scale(${scale})`;
          outgoing.style.opacity   = opacity;
        },
      });
    }

    /* ── Main ────────────────────────────────────────────── */
    async function bootstrap() {
      // Wait for GSAP + friends
      await new Promise(r => {
        const check = () => {
          if (window.gsap && window.ScrollTrigger && window.Lenis && window.THREE && window.d3 && window.katex) {
            gsap.registerPlugin(ScrollTrigger);
            r();
          } else {
            setTimeout(check, 40);
          }
        };
        check();
      });

      /* Lenis smooth scroll — disabled on touch/mobile to avoid iOS conflicts */
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      let lenis = null;

      if (!isTouchDevice) {
        lenis = new Lenis({
          duration: 1.2,
          easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true,
          touchMultiplier: 0,  // disable on touch even if somehow enabled
        });
        window.lenisInstance = lenis;

        // Tie Lenis to GSAP ticker AND feed scroll events to ScrollTrigger
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add(time => lenis.raf(time * 1000));
        gsap.ticker.lagSmoothing(0);
      } else {
        // On touch devices: feed native scroll directly to ScrollTrigger
        window.addEventListener('scroll', ScrollTrigger.update, { passive: true });
        window.lenisInstance = null;
      }

      /* Load slide HTML concurrently */
      await Promise.all([
        loadHTML("slide-01-container", "slides/slide-01-hero/hero.html"),
        loadHTML("slide-02-container", "slides/slide-02-motivation/motivation.html"),
        // FIX 2 — APU-X (slide-04) loads into container 3 so it appears before PMM (slide-03)
        loadHTML("slide-03-container", "slides/slide-04-apux-substrate/apux.html"),
        loadHTML("slide-04-container", "slides/slide-03-pmm-technical/pmm.html"),
        loadHTML("slide-05-container", "slides/slide-05-simulations/sims.html"),
        loadHTML("slide-06-container", "slides/slide-06-animations/anim.html"),
      ]);

      /* Load scripts robustly so one failure doesn't halt the others */
      const scripts = [
        ["slides/slide-01-hero/hero.js",           "text/javascript"],
        ["slides/slide-02-motivation/motivation.js","text/javascript"],
        // FIX 2 — load APU-X script before PMM to match new visual order
        ["slides/slide-04-apux-substrate/apux.js",  "module"],
        ["slides/slide-03-pmm-technical/pmm.js",    "text/javascript"],
        ["slides/slide-05-simulations/sims.js",     "module"],
        ["slides/slide-06-animations/anim.js",      "module"],
        // FIX 3 — InspectOverlay for SPICE sim cards
        ["scripts/inspect-overlay.js",              "text/javascript"],
        // Global AI Widget
        ["scripts/ai-widget.js",                    "text/javascript"],
      ];
      
      for (const [src, type] of scripts) {
        try {
          await loadScript(src, type);
        } catch (err) {
          console.error(`Failed to load ${src}`, err);
        }
      }

      /* Wire inter-slide transitions — desktop only.
         On touch devices GSAP ScrollTrigger transform animations
         appear as abrupt jumps because the browser compositor
         batches passive scroll events; native CSS handles it better. */
      if (!isTouchDevice) {
        // NOTE: slide-02 excluded — its own GSAP pin handles exit.
        // After FIX 2 swap: APU-X=id#slide-04 (pos 3), PMM=id#slide-03 (pos 4)
        wireSlideTransition("#slide-01", "#slide-02");
        // APU-X exit: zoom scale-up (1→2.5) to give impression of diving into the hardware
        wireZoomOutTransition("#slide-04");
        // PMM exit: standard clip transition into Simulations slide
        wireSlideTransition("#slide-03", "#slide-05");
        wireSlideTransition("#slide-05", "#slide-06");
      } else {
        /* Mobile: rich slide-reveal animation using IntersectionObserver.
           Each slide starts with a translate+fade state and snaps in smoothly
           as it scrolls into view. */
        const slideEls = document.querySelectorAll(
          '#slide-01, #slide-02, #slide-03, #slide-04, #slide-05, #slide-06'
        );

        // Inject the mobile-reveal keyframes/classes once
        if (!document.getElementById('mobile-slide-reveal-styles')) {
          const style = document.createElement('style');
          style.id = 'mobile-slide-reveal-styles';
          style.textContent = `
            @media (max-width: 1024px) {
              .slide-reveal-init {
                opacity: 0;
                transform: translateY(48px) scale(0.97);
                transition:
                  opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
                will-change: opacity, transform;
              }
              .slide-reveal-visible {
                opacity: 1 !important;
                transform: translateY(0) scale(1) !important;
              }
              /* Stagger child elements inside revealed slides */
              .slide-reveal-visible .sims-header,
              .slide-reveal-visible .hero-content-wrapper,
              .slide-reveal-visible .s2-panel-a-content,
              .slide-reveal-visible .pmm-content-area,
              .slide-reveal-visible .apux-header {
                animation: mobileChildReveal 0.55s cubic-bezier(0.16,1,0.3,1) 0.15s both;
              }
              @keyframes mobileChildReveal {
                from { opacity: 0; transform: translateY(24px); }
                to   { opacity: 1; transform: translateY(0); }
              }
              /* Slide 01 hero is visible immediately — no delay */
              #slide-01.slide-reveal-init {
                opacity: 1;
                transform: none;
              }
            }
          `;
          document.head.appendChild(style);
        }

        const revealObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('slide-reveal-visible');
                // Once revealed, unobserve so it stays visible
                revealObserver.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.08 }
        );

        slideEls.forEach(el => {
          // Hero slide is already visible on load
          if (el.id === 'slide-01') {
            el.classList.add('slide-reveal-visible');
          } else {
            el.classList.add('slide-reveal-init');
            revealObserver.observe(el);
          }
        });
      }


      /* Global progress dots */
      initProgressDots();

      /* Refresh ScrollTrigger after all DOM is settled */
      setTimeout(() => ScrollTrigger.refresh(), 200);

      /* Re-refresh on orientation change (mobile) */
      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          ScrollTrigger.refresh(true);
          // Redraw any D3 charts
          window.dispatchEvent(new Event('resize'));
        }, 300);
      });

      /* Re-refresh on resize (catches virtual keyboard, etc.) */
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => ScrollTrigger.refresh(), 150);
      });

      console.log("[PMM Portfolio] All slides loaded ✓");
    }

    bootstrap().catch(err => {
      console.error("[PMM Portfolio] Bootstrap error:", err);
    });
  </script>

</body>
</html>
